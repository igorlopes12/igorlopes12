name: Generate Snake Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # runs every day at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Snake (Dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6E3CBC&color_dots=#bfb0dc,#8e7cc3,#6E3CBC,#4a2f7a,#2c1a4a
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#6E3CBC&color_dots=#bfb0dc,#8e7cc3,#6E3CBC,#4a2f7a,#2c1a4a

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
